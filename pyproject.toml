[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pid-video-decoder"
version = "0.1.0"
description = "Experimental H3-latent conditioned PiD video decoder with direct x0 prediction"
requires-python = ">=3.10"
[tool.setuptools.packages.find]
include = ["pid_video*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
